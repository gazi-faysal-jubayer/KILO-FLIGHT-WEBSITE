<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Join Team Kilo Flight - KUET Formula Student Recruitment & Industry Partner Application Portal.">
    <meta name="author" content="Team Kilo Flight - KUET">

    <title>Join Team Kilo Flight | Formula Student Portal</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/logo.ico">

    <!-- CSS FILES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/templatemo-festava-live.css" rel="stylesheet">
</head>

<body>

    <main>

        <!-- NAVIGATION BAR -->
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a href="index.html" class="navbar-brand">
                    <img src="images/logo.png" alt="Team Kilo Flight Logo" class="logo-img">
                    <div class="brand-text">KILO <span>FLIGHT</span></div>
                </a>

                <a href="index.html" class="btn custom-btn-outline ms-auto">Back to Home</a>
            </div>
        </nav>


        <!-- JOIN / RECRUITMENT SECTION -->
        <section class="section-padding py-5" style="min-height: 85vh; background: radial-gradient(circle at center, rgba(14, 20, 32, 0.7) 0%, var(--dark-bg) 100%);">
            <div class="container">
                <div class="row text-center mb-4">
                    <div class="col-lg-8 mx-auto">
                        <span class="badge-motorsport red mb-2">Recruitment & Partnerships</span>
                        <h1 class="text-white mb-2" style="font-size: 38px;">JOIN TEAM KILO FLIGHT</h1>
                        <p class="text-muted">Apply to become a student engineer on Bangladesh's premier Formula Student team or request a sponsor packet.</p>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10">
                        <div class="glass-panel p-4 p-md-5">
                            
                            <form action="#" method="post">
                                <h4 class="text-white mb-4"><i class="bi bi-person-badge text-cyan me-2"></i> Application Form</h4>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Full Name</label>
                                        <input type="text" class="form-control" placeholder="John Doe" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Email Address</label>
                                        <input type="email" class="form-control" placeholder="name@kuet.ac.bd" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Phone Number</label>
                                        <input type="tel" class="form-control" placeholder="+880 1700-000000" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Application Type</label>
                                        <select class="form-control form-select" required style="color:#FFF;">
                                            <option value="student">Student Recruitment Application</option>
                                            <option value="sponsor">Corporate Sponsor Packet Request</option>
                                            <option value="alumni">Alumni Mentor / Advisory</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label text-muted small">Preferred Sub-Team / Department</label>
                                    <div class="row g-2">
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptAero" checked>
                                                <label class="form-check-label text-white small" for="deptAero">Aerodynamics</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptChassis">
                                                <label class="form-check-label text-white small" for="deptChassis">Chassis</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptPowertrain">
                                                <label class="form-check-label text-white small" for="deptPowertrain">Powertrain</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptElec">
                                                <label class="form-check-label text-white small" for="deptElec">Electronics</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptBiz">
                                                <label class="form-check-label text-white small" for="deptBiz">Business / PR</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4 col-6">
                                            <div class="form-check form-control p-2">
                                                <input class="form-check-input ms-1 me-2" type="radio" name="deptChoice" id="deptDriver">
                                                <label class="form-check-label text-white small" for="deptDriver">Driver Team</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label text-muted small">Statement of Interest & Technical Background</label>
                                    <textarea class="form-control" rows="4" placeholder="Mention your department at KUET (or company), software skills (CAD, SolidWorks, MATLAB, Ansys), or past projects..." required></textarea>
                                </div>

                                <button type="submit" class="btn custom-btn w-100 py-3">Submit Application</button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer py-4">
        <div class="container text-center small text-muted">
            Copyright © 2026 Team Kilo Flight | Khulna University of Engineering & Technology (KUET).
        </div>
    </footer>

    <!-- JAVASCRIPT FILES -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/custom.js"></script>

</body>

</html>
